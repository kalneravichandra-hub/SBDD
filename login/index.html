<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SBDD - Customer Login</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="whole-container">
            <header class="header">

                <div class="header-left">

                    <div class="logo">
                        <img src="SBDD logo.png.jpeg" alt="SBDD">
                    </div>
                    
                    <div class="text">
                        <h3> Sand Bazar Door Delivery (SBDD) </h3>
                        <p>Hyderabad sand and building materials</p>
                        <p>delivered to your doorstep</p>
                    </div>

                    <div class="lorry-logo">
                        <img src="lorry logo.png.jpeg" alt="lorry">
                    </div>
                </div>

                <div class="header-right">

                    <div class="image">
                        KMK
                    </div>
                    
                    <div class="text">
                        <strong>KMK</strong><br>
                        <span>
                            <strong class="captital-letters">K</strong>ALNE 
                            <strong class="captital-letters">M</strong>ALLESHAM 
                            <strong class="captital-letters">K</strong>URUMA
                        </span>
                    </div>
                </div>
            </header>  
            
            <div class="main-container">
                <div class="title-bar">
                    <h4>SBDD - ONLINE BOOKING</h4>
                </div>
                    
                    
                <div class="login-box">
                    <div class="login-heading">
                        <h2>Customer Login details</h2>
                    </div>
                
                    <div class="login-details">
                        <form action="" method="post">
                            <div class="details">
                                <label for="username">Username:</label>
                                <input type="text" id="username" name="username" required>
                            </div>
                            <div class="details">
                                <label for="password">Password:</label>
                                <input type="password" id="password" name="password" required>
                            </div>
                            <div class="submit">
                                    <input type="submit" value="Login">
                            </div>
                        </form>
                    </div>
                        

                    <div class="links">
                        <a href="signup.html">Sign up</a>
                        <a href="Forgot Password.html">Forgot password?</a>
                    </div>
                </div>
           </div>     
            <footer class="footer">
                <span>
                    Designed and Developed by <strong>KMK developers</strong>.
                </span>
            </footer>
        </div>
    </body>
</html>
